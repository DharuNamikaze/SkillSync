openapi: 3.0.3
info:
  title: SkillSync Backend API
  version: 1.0.0
  description: |
    Express (TypeScript) API for SkillSync: users, skills, projects, notifications, dashboard.
servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "5000"
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /api/users/upsert:
    post:
      summary: Create or update a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/users/profile:
    get:
      summary: Get current user profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update current user profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete current user
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      summary: List users
      tags: [Users]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
  /api/skills:
    get:
      summary: Get current user's skills
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkills'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a skill
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/search:
    get:
      summary: Search current user's skills
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkills'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/categories:
    get:
      summary: Distinct categories
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/category/{category}:
    get:
      summary: Skills by category
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkills'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/{id}:
    get:
      summary: Get skill by ID
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update skill
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete skill
      tags: [Skills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects:
    get:
      summary: List projects
      tags: [Projects]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [planning, recruiting, active, completed, paused]
        - in: query
          name: difficulty
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
    post:
      summary: Create project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectInput'
                - type: object
                  required: [templateId, sandboxTemplate]
                  properties:
                    templateId:
                      type: string
                    sandboxTemplate:
                      type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/stats:
    get:
      summary: Project status stats
      tags: [Projects]
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ProjectStats'
                  message:
                    type: string
  /api/projects/{id}:
    get:
      summary: Get project by ID
      tags: [Projects]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProject'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update project (creator only)
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete project (creator only)
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/user/projects:
    get:
      summary: Current user's projects
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/{id}/join:
    post:
      summary: Join project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/leave:
    post:
      summary: Leave project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications:
    get:
      summary: List notifications
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, projects, tasks, comments, team, system]
        - in: query
          name: unreadOnly
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications/unread-count:
    get:
      summary: Unread notification count
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications/{id}:
    get:
      summary: Get notification by ID
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete notification
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications/{id}/read:
    put:
      summary: Mark notification as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications/mark-all-read:
    put:
      summary: Mark all notifications as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/dashboard/stats:
    get:
      summary: Dashboard stats
      tags: [Dashboard]
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
                  message:
                    type: string
  /api/dashboard/activities:
    get:
      summary: Recent activities (mock)
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/dashboard/tasks:
    get:
      summary: Upcoming tasks (mock)
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/dashboard/skills:
    get:
      summary: Skill progress (real or mock)
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSkills'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
        googleId:
          type: string
          nullable: true
        email:
          type: string
        name:
          type: string
        picture:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        socialLinks:
          type: object
          properties:
            github:
              type: string
              nullable: true
            linkedin:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserInput:
      type: object
      properties:
        googleId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        picture:
          type: string
          format: uri
      anyOf:
        - required: [email]
        - required: [googleId]
    UserUpdate:
      type: object
      properties:
        bio:
          type: string
        title:
          type: string
        socialLinks:
          type: object
          properties:
            github:
              type: string
              format: uri
            linkedin:
              type: string
              format: uri
    Skill:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced, Expert]
        category:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SkillInput:
      type: object
      required: [name, level, category]
      properties:
        name:
          type: string
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced, Expert]
        category:
          type: string
    SkillUpdate:
      type: object
      properties:
        name:
          type: string
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced, Expert]
        category:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, recruiting, active, completed, paused]
        technologies:
          type: array
          items:
            type: string
        templateId:
          type: string
        sandboxTemplate:
          type: string
        isPublic:
          type: boolean
        workspace:
          type: object
          properties:
            ideUrl:
              type: string
            sandboxId:
              type: string
            embedUrl:
              type: string
            editUrl:
              type: string
        members:
          type: object
          properties:
            current:
              type: integer
            max:
              type: integer
            userIds:
              type: array
              items:
                type: string
        progress:
          type: integer
        deadline:
          type: string
          format: date-time
        createdBy:
          type: string
        department:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        tags:
          type: array
          items:
            type: string
        metrics:
          type: object
          properties:
            commits:
              type: integer
            issues:
              type: integer
            stars:
              type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [name, description, maxMembers, deadline, department, difficulty]
      properties:
        name:
          type: string
        description:
          type: string
        technologies:
          type: array
          items:
            type: string
        maxMembers:
          type: integer
          minimum: 1
        deadline:
          type: string
          format: date-time
        department:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        tags:
          type: array
          items:
            type: string
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, recruiting, active, completed, paused]
        technologies:
          type: array
          items:
            type: string
        maxMembers:
          type: integer
        deadline:
          type: string
          format: date-time
        department:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        tags:
          type: array
          items:
            type: string
        progress:
          type: integer
    ProjectStats:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        recruiting:
          type: integer
        completed:
          type: integer
        planning:
          type: integer
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [invitation, task_assignment, comment, deadline, achievement, mention, team_update, system]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high]
        sender:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            avatar:
              type: string
            role:
              type: string
        actionUrl:
          type: string
        category:
          type: string
        metadata:
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseMessage:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
    ApiResponseUser:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: '#/components/schemas/User'
        message:
          type: string
    ApiResponseUsers:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        message:
          type: string
    PaginatedUsers:
      allOf:
        - $ref: '#/components/schemas/ApiResponseUsers'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
    ApiResponseSkill:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: '#/components/schemas/Skill'
        message:
          type: string
    ApiResponseSkills:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: array
