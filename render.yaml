# Render Blueprint for the frontend static site
# If your frontend is in a subfolder, add `rootDir: frontend` under the service.

services:
  - type: static
    name: skill-sync-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
